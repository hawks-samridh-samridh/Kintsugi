name: Kintsugi Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl create "KintsugiTest" "iPhone 16 Pro" \
            $(xcrun simctl list runtimes | grep "iOS 18" | tail -1 \
              | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS[^ ]+') \
            2>/dev/null) \
          || UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['devices']
          phones = [v for vals in d.values() for v in vals
                    if 'iPhone' in v['name'] and v['isAvailable']]
          print(phones[0]['udid'])
          ")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          sleep 8

      - name: Build for simulator
        run: |
          cd Kintsugi.swiftpm
          xcodebuild build \
            -scheme Kintsugi \
            -destination "id=${{ env.UDID }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee /tmp/build.log | grep -E "error:|BUILD FAILED|BUILD SUCCEEDED|\.swift:[0-9]" || true
          # propagate failure
          tail -5 /tmp/build.log
          grep -q "BUILD FAILED" /tmp/build.log && exit 1 || true

      - name: Wrap binary into .app bundle
        run: |
          # SPM executable builds a bare binary — wrap it in the bundle structure simctl needs
          PRODUCTS="DerivedData/Build/Products/Debug-iphonesimulator"
          BINARY="$PRODUCTS/Kintsugi"
          APP="/tmp/Kintsugi.app"

          mkdir -p "$APP"
          cp "$BINARY" "$APP/Kintsugi"

          # copy any swift package framework dependencies
          if [ -d "$PRODUCTS/PackageFrameworks" ]; then
            mkdir -p "$APP/Frameworks"
            cp -R "$PRODUCTS/PackageFrameworks/"* "$APP/Frameworks/" 2>/dev/null || true
          fi

          # minimal Info.plist so simctl knows it's an iOS app
          cat > "$APP/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Kintsugi</string>
              <key>CFBundleIdentifier</key>
              <string>com.kintsugi.app</string>
              <key>CFBundleName</key>
              <string>Kintsugi</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>DTPlatformName</key>
              <string>iphonesimulator</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          PLIST

          # ad-hoc sign so the simulator accepts it
          codesign --force -s - "$APP"
          echo "APP=$APP" >> $GITHUB_ENV
          echo "Wrapped: $(ls -la $APP)"

      - name: Install and launch
        run: |
          xcrun simctl install "${{ env.UDID }}" "${{ env.APP }}"
          xcrun simctl launch "${{ env.UDID }}" com.kintsugi.app
          mkdir -p screenshots

      # SCNAction timer: scene-clock based — advances with rendered frames, not main queue
      # App timeline (scene-clock): t=0 vase fades in, t=25s shatter fires,
      #   t=25.9s scatter done, t=30.9s settle done, t=32.9s repair stage
      # CI overhead: install+launch until xcrun simctl launch returns ≈ 3-5s, so
      # "sleep 0" ≈ scene-clock t=3-5s. CI time = scene-clock - 3-5s overhead.
      # shot01: CI+12s → scene ~t=15-17s (shatter at 25s, 8-10s margin) → intact ✓
      # shot02: CI+10s → scene ~t=25-27s (shatter at 25s, scatter in progress) → fragments ✓
      # shot03: CI+20s → scene ~t=45-47s (repair at 32.9s, 12-15s into repair) → overlay ✓

      # t_CI≈12s — intact vase (shatter fires at CI t≈20-22s, 8-10s margin)
      - name: Screenshot 01 — vase intact
        run: |
          sleep 12
          xcrun simctl io "${{ env.UDID }}" screenshot screenshots/01-vase-intact.png

      # t_CI≈22s — fragments fully scattered (shatter at CI t≈20s, scatter done at ~21s)
      - name: Screenshot 02 — shatter
        run: |
          sleep 10
          xcrun simctl io "${{ env.UDID }}" screenshot screenshots/02-shatter.png

      # t_CI≈42s — repair stage, crack overlay visible (repair starts at CI t≈28s)
      - name: Screenshot 03 — repair stage
        run: |
          sleep 20
          xcrun simctl io "${{ env.UDID }}" screenshot screenshots/03-repair-overlay.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: kintsugi-screenshots
          path: screenshots/
          retention-days: 30
